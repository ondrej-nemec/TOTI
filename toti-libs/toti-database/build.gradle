
// Apply the java-library plugin to add support for Java Library
plugins {
    id 'java-library'
	id 'java-test-fixtures'
    id 'maven-publish'
}

group = project.libraryGroup
version = project.projectVersion

publishing {
    publications {
        myLibrary(MavenPublication) {
            from components.java
        }
    }

     repositories {
        maven {
            name = "local"
            url = uri(project.publishPath)
        }
    }
}
test {
    useJUnitPlatform()
}

compileTestJava.options.encoding = 'UTF-8'
// In this section you declare where to find the dependencies of your project
repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
	api project(':toti-libs:toti-common')
	api project(':toti-libs:toti-files')

	/***********  TESTS *******************/
	testImplementation(testFixtures(project(':toti-libs:toti-common')))
	
	// https://mvnrepository.com/artifact/org.xerial/sqlite-jdbc
	testImplementation group: 'org.xerial', name: 'sqlite-jdbc', version: '3.53.4.0'
	// Source: https://mvnrepository.com/artifact/com.mysql/mysql-connector-j
	implementation group: 'com.mysql', name: 'mysql-connector-j', version: '26.7.0'
	
	// https://mvnrepository.com/artifact/org.postgresql/postgresql
	testImplementation group: 'org.postgresql', name: 'postgresql', version: '42.7.13'

	// https://mvnrepository.com/artifact/com.microsoft.sqlserver/sqljdbc4
	testImplementation group: 'com.microsoft.sqlserver', name: 'sqljdbc41', version: '4.1'
	
	//testImplementation fileTree(dir: "libs/derby", includes: ['*.jar'])
	// https://mvnrepository.com/artifact/com.microsoft.sqlserver/mssql-jdbc
	//testCompile group: 'com.microsoft.sqlserver', name: 'mssql-jdbc', version: '9.1.1.jre15-preview'

	// https://mvnrepository.com/artifact/org.mockito/mockito-core
	testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.24.0'
	testFixturesImplementation group: 'org.mockito', name: 'mockito-core', version: '5.24.0'

	// Source: https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: '6.1.3'
	testFixturesImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: '6.1.3'
	// https://github.com/gradle/gradle/issues/34512
	testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '6.1.3'
	testFixturesRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '6.1.3'
}

