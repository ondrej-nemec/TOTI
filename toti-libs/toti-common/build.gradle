
// Apply the java-library plugin to add support for Java Library
plugins {
    id 'java-library'
	id 'java-test-fixtures'
    id 'maven-publish'
}

group = project.libraryGroup
version = '1.0'

publishing {
    publications {
        myLibrary(MavenPublication) {
            from components.java
        }
    }

     repositories {
        maven {
            name = "local"
            url = uri(project.publishPath)
        }
    }
}

compileTestJava.options.encoding = 'UTF-8'
// In this section you declare where to find the dependencies of your project
repositories {
    mavenCentral()
}

dependencies {
	testImplementation(testFixtures(project))

	// https://mvnrepository.com/artifact/org.slf4j/slf4j-api
	//api group: 'org.slf4j', name: 'slf4j-api', version: '2.0.0-alpha7'
	// https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-api
	api group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.26.1'
	
	// https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
	api group: 'org.apache.commons', name: 'commons-lang3', version: '3.20.0'
	
	/***********  TESTS *******************/

	// https://mvnrepository.com/artifact/org.mockito/mockito-core
	testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.24.0'
	testFixturesImplementation group: 'org.mockito', name: 'mockito-core', version: '5.24.0'
	
	// https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '6.1.3'
	testFixturesImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '6.1.3'
	// https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-params
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '6.1.3'
	testFixturesImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '6.1.3'

	// Source: https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-engine
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
	testFixturesRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
	// Source: https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
	// https://github.com/gradle/gradle/issues/34512
	testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '6.1.3'
	testFixturesRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '6.1.3'
}

