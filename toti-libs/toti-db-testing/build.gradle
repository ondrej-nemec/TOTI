plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

compileTestJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
	api project(':toti-libs:toti-common')
	api project(':toti-libs:toti-database')
	testImplementation(testFixtures(project))
	
	// https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
	implementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.11.4'
	
	
	// https://mvnrepository.com/artifact/org.mockito/mockito-core
	implementation group: 'org.mockito', name: 'mockito-core', version: '2.19.1'

	// https://github.com/gradle/gradle/issues/34512
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	
	// https://mvnrepository.com/artifact/mysql/mysql-connector-java
	testImplementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.17'
	// https://mvnrepository.com/artifact/org.postgresql/postgresql
	testImplementation group: 'org.postgresql', name: 'postgresql', version: '42.2.16'
	
}

