plugins {
    id 'java-library'
    id 'maven-publish'
}

group = project.coreGroup
version = project.projectVersion

publishing {
    publications {
        myLibrary(MavenPublication) {
            from components.java
        }
    }

     repositories {
        maven {
            name = "local"
            url = uri(project.publishPath)
        }
    }
}

compileTestJava.options.encoding = 'UTF-8'

repositories {
	mavenCentral()
}

dependencies {
	api project(':toti-libs:toti-common')
	api project(':toti-libs:toti-tcpip')
	
	//implementation group: 'at.favre.lib', name: 'bcrypt', version: '0.9.0'
	
	// used for Link:create
	// Source: https://mvnrepository.com/artifact/org.objenesis/objenesis
	implementation group: 'org.objenesis', name: 'objenesis', version: '3.6'
	// Source: https://mvnrepository.com/artifact/net.bytebuddy/byte-buddy
	implementation group: 'net.bytebuddy', name: 'byte-buddy', version: '1.18.14'
    // Source: https://mvnrepository.com/artifact/net.bytebuddy/byte-buddy-agent
	implementation group: 'net.bytebuddy', name: 'byte-buddy-agent', version: '1.18.14'
    
    // https://mvnrepository.com/artifact/org.eclipse.jetty/jetty-server
	implementation group: 'org.eclipse.jetty', name: 'jetty-server', version: '12.1.13'
	// https://mvnrepository.com/artifact/org.eclipse.jetty.http2/jetty-http2-server
	implementation group: 'org.eclipse.jetty.http2', name: 'jetty-http2-server', version: '12.1.13'
	// https://mvnrepository.com/artifact/org.eclipse.jetty/jetty-alpn-server
	implementation group: 'org.eclipse.jetty', name: 'jetty-alpn-server', version: '12.1.13'
	// https://mvnrepository.com/artifact/org.eclipse.jetty/jetty-alpn-java-server
	implementation group: 'org.eclipse.jetty', name: 'jetty-alpn-java-server', version: '12.1.13'
	// https://mvnrepository.com/artifact/org.eclipse.jetty.websocket/jetty-websocket-jetty-api
	implementation group: 'org.eclipse.jetty.websocket', name: 'jetty-websocket-jetty-api', version: '12.1.13'
	// https://mvnrepository.com/artifact/org.eclipse.jetty.websocket/jetty-websocket-jetty-server
	implementation group: 'org.eclipse.jetty.websocket', name: 'jetty-websocket-jetty-server', version: '12.1.13'

	/***********  TESTS *******************/
	testImplementation(testFixtures(project(':toti-libs:toti-common')))
	testImplementation(testFixtures(project(':toti-libs:toti-database')))

	// Source: https://mvnrepository.com/artifact/commons-io/commons-io
	//implementation group: 'commons-io', name: 'commons-io', version: '2.22.0'

	// https://mvnrepository.com/artifact/org.mockito/mockito-core
	testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.24.0'
	
	// https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '6.1.3'
	// https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-params
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '6.1.3'

	// Source: https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-engine
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
	// Source: https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
	testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '6.1.3'
}

