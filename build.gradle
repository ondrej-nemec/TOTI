plugins {
	id 'java-library'
	id 'maven-publish'
	id 'org.cyclonedx.bom' version '3.4.1'
}

ext {
	projectGroup = 'com.github.toti'
	coreGroup = 'com.github.toti.core'
	libraryGroup = 'com.github.toti.lib'
	extensionGroup = 'com.github.toti.extension'
	publishPath = '/home/coder/project/publish'
	version = '1.0.0-alpha2'
}

group = project.projectGroup
version = project.version

publishing {
	publications {
		myLibrary(MavenPublication) {
			from components.java
		}
	}

	 repositories {
		maven {
			name = "local"
			url = uri(project.publishPath)
		}
	}
}

compileTestJava.options.encoding = 'UTF-8'

repositories {
	mavenCentral()
}

dependencies {
	api project('toti-libs:toti-common')
	api project('toti-libs:toti-database')
	api project('toti-libs:toti-files')
	api project('toti-libs:toti-translate')
	api project('toti-libs:toti-tcpip')
	api project('toti-libs:toti-templating')
	
	api project('toti-core')
	
	api project('toti-extensions:te-database')
	api project('toti-extensions:te-validation')
	api project('toti-extensions:te-templating')
	api project('toti-extensions:te-translator')
	api project('toti-extensions:te-ui')
}

