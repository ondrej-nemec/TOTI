<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>TOTI Documentation</title>
	<link rel="icon" href="https://raw.githubusercontent.com/ondrej-nemec/TOTI/master/logo.jpg">
<!-- V1.0.0 -->
<style>
	/* select  */
	:root {
		--primary-color: #0891B2;
	}
	/*************/
	:root { --body-bg: #ffffff; --body-color: #2c3e50; --secondary-color: #6b7280; --card: #f4f6f8; --border: #e5e7eb; --code-bg: #f4f6f8; }
	[data-theme="dark"] { --body-bg: #0f172a; --body-color: #e5e7eb; --secondary-color: #9ca3af; --card: #111827; --border: #1f2937; --code-bg: #1e293b; }

	body { margin: 0; font-family: system-ui, sans-serif; background: var(--body-bg); color: var(--body-color); }
	.header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); height: 20px; position: fixed; top: 0; background:var(--body-bg); width: 95%; }
	.brand { font-weight: 600; color: var(--primary-color); }
	.container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
	h1 { margin: 0 0 10px 0; color: var(--primary-color); }
	h2 { margin: 0 0 10px 0; font-weight: normal; color: var(--secondary-color); }
	h3 { margin: 0 0 10px 0; font-weight: normal; color: var(--secondary-color); }
	h4 { margin: 0 0 10px 0; font-weight: normal; color: var(--secondary-color); }
	h5 { margin: 0 0 10px 0; font-weight: normal; color: var(--secondary-color); }
	a { color: var(--primary-color) }

	.toggle-button { background: transparent; color: var(--body-color); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
	[data-theme="dark"] #theme-dark { display: none; }
	[data-theme="light"] #theme-light { display: none; }
	.actions { display: flex; gap: 10px; font-size: 14px; color: var(--secondary-color); }

	/******** alert **********/
	.alert { background: var(--code-bg); border-left: 4px solid var(--primary-color); padding: 12px; font-family: monospace; overflow-x: auto; }
	/******** boxes **********/
	.card { border-radius: 10px; padding: 16px; margin-bottom: 16px; background: var(--card); border: 1px solid var(--border); }
	/******** normal text **********/
	.paragraph { margin-bottom: 16px; }

	/*********** hiddable *************/
	.section { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
	.section-header { padding: 12px 16px; cursor: pointer; justify-content: space-between; display: flex; }
	.section-header:hover {  background: var(--border); }
	.chevron {  transition: transform 0.2s; color: var(--secondary-color); }
	.section.collapsed .chevron {  transform: rotate(-90deg); }
	.section.collapsed .section-content {  display: none; }

	/***************************/
	footer {
		height: 30px;
		background: var(--card);
		display: flex;
		align-items: center;
		gap: 15px;
		padding: 0 10px;
		font-size: 13px;
	}

	:root{
		--sidebar-left-width:260px;
		--sidebar-right-width:220px;
		--header-height:60px;
		--radius:10px;
		--gap:24px;
	}
	.layout{
		display:grid;
		grid-template-columns: var(--sidebar-left-width) minmax(0,1fr) var(--sidebar-right-width);
		gap: var(--gap);
		max-width:1600px;
		margin: 30px auto;
		padding:24px;
	}
	.content{
		min-width:0;
	}
	.sidebar-left{
		position:sticky;
		top:40px;
		align-self:start;
		max-height:calc(100vh - 40px);
		overflow:auto;
		border-right:1px solid var(--border);
		padding-right:20px;
	}
	.sidebar-right{
		position:sticky;
		top:40px;
		align-self:start;
		max-height:calc(100vh - 40px);
		overflow:auto;
		border-left:1px solid var(--border);
		padding-left:20px;
		font-size:14px;
	}
	.menu, .menu ul {
		list-style:none;
		margin:0;
		padding-left:18px;
	}
	.menu > li{
		padding:4px 0;
	}
	.menu a{
		display:block;
		padding:5px 8px;
		border-radius:6px;
		color:var(--body-color);
		text-decoration:none;
	}
	.menu a:hover{
		background:var(--card);
	}
	.toc, .toc ul{
		list-style:none;
		margin:0;
		padding-left:15px;
	}
	.toc a{
		display:block;
		padding:4px 0;
		color:var(--secondary-color);
		text-decoration:none;
	}
	.toc a:hover{
		color:var(--primary-color);
	}
	.menu-link {
		cursor: pointer;
	}
	li[level="0"] {
		font-size: 1em;
	}
	li[level="1"] {
		font-size: 0.95em;
	}
	li[level="3"] {
		font-size: 0.90em;
	}

	code {
		color: #d63384;
	}
	.inner-link { color: var(--primary-color); text-decoration:underline; cursor:pointer; }


	#menuButton {
		display: none;
	}
	#tocButton {
		display: none;
	}
	@media (max-width:1100px){
		.layout{
			grid-template-columns: minmax(0,1fr) var(--sidebar-right-width);
		}
		.sidebar-left {
			position:fixed;
			top:30px;
			bottom:0;
			width:280px;
			background:var(--body-bg);
			overflow:auto;
			z-index:100;
			transition:.3s;
			box-shadow:0 0 20px rgba(0,0,0,.25);
			left:-300px;
		}
		.sidebar-left.open{
			left:0;
		}
		#menuButton {
			display: inherit;
		}
	}

	@media (max-width:800px) {
		.layout {
			grid-template-columns: minmax(0,1fr);
			padding:15px;
		}
		.sidebar-left, .sidebar-right {
			position:fixed;
			top:30px;
			bottom:0;
			width:280px;
			background:var(--body-bg);
			overflow:auto;
			z-index:100;
			transition:.3s;
		}
		.sidebar-left{
			left:-300px;
		}
		.sidebar-right{
			right:-300px;
		}
		.sidebar-left.open{
			left:0;
		}
		.sidebar-right.open{
			right:0;
		}
		#menuButton, #tocButton {
			display: inherit;
		}
	}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/default.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

<!--<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/html.min.js"></script>-->

</head>

<body>
	<div class="header">
		<div class="brand">TOTI - Really cool framework</div>

		<div class="actions">
			<button class="toggle-button" onclick="toggleTheme()">
				<span id="theme-light">☀️</span>
				<span id="theme-dark">🌙</span>
			</button>
			<button id="menuButton" class="toggle-button">☰</button>
			<button id="tocButton" class="toggle-button">☷</button>
		</div>
	</div>


	<div class="layout">

		<aside class="sidebar-left">
			<ul class="menu"></ul>
		</aside>

		<main class="content container"></main>

		<aside class="sidebar-right">
			<ul class="toc"></ul>
		</aside>

	</div>

	<footer>
		©&nbsp;Ondřej Němec 2018&nbsp;-&nbsp;<span id="year"></span>
	</footer>

</body>


<script>
	document.getElementById('year').innerText = new Date().getFullYear();
	// dark/light
	document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
	function toggleTheme() {
		const html = document.documentElement;
		const current = html.getAttribute("data-theme");
		var theme = current === "dark" ? "light" : "dark";
		html.setAttribute("data-theme", theme);
		localStorage.setItem("theme", theme);
	}
	// collapsable
	function toggleSection(header) {
		const section = header.parentElement;
		section.classList.toggle("collapsed");
	}
	document.getElementById('menuButton').onclick = ()=>document.querySelector(".sidebar-left").classList.toggle("open");
	document.getElementById('tocButton').onclick = ()=>document.querySelector(".sidebar-right").classList.toggle("open");

	function setMemory(name, value) {
		const url = new URL(window.location);
		url.searchParams.set(name, value);
		history.pushState(null, '', url);
	}
	const urlParams = new URLSearchParams(window.location.search);
	const selectedPage = urlParams.get('page');

	var main = document.querySelector('main.content');
	var toc = document.querySelector('ul.toc');
	function showPage(data, content) {
		toc.innerHTML = "";
		main.innerHTML = content.html;
		var qeue = [{
			level: 2,
			container: toc
		}];
		var index = 0;
		main.querySelectorAll('h2, h3, h4, h5').forEach(h=>{
			var last = qeue[qeue.length - 1];
			var level = parseInt(h.tagName.replace('H', ''));
			if (level > last.level) {
				var ul = document.createElement('ul');
				last.container.appendChild(ul);
				last = {
					level: level,
					container: ul
				};
				qeue.push(last);
			}
			if (level < last.level) {
				while (level != last.level) {
					qeue.pop();
					last = qeue[qeue.length - 1];
				}
			}
			h.setAttribute('id', 'index-' + index);
			var title = document.createElement('span');
			title.addEventListener('click', e=>{
				h.scrollIntoView();
			});
			title.innerText = h.innerText;

			var container = document.createElement('li');
			container.appendChild(title);
			last.container.appendChild(container);
		});
		hljs.highlightAll();
		main.querySelectorAll('.inner-link').forEach(link=>{
			link.addEventListener('click', e=>{
				var href = link.getAttribute('href') + '.html';
				showPage(data, data.get(href));
				setMemory('page', href);
			});
		});
	}
	// TODO change language
	function addMenuItem(data, url, parent, item, level) {
		var container = document.createElement('li');
		container.setAttribute('level', level);
		parent.appendChild(container);

		var titleElement = document.createElement('span');
		titleElement.innerText = item.name;
		container.appendChild(titleElement);
		if (item.hasOwnProperty('link')) {
			titleElement.setAttribute('link', item.link);
			titleElement.classList.add('menu-link');
			titleElement.addEventListener('click', e=>{
				showPage(data, data.get(item.link));
				setMemory('page', item.link);
			});
			fetch(url + item.link).then(res=>{
				return res.text();
			}).then(body=>{
				data.add(item.link, body);
				if (item.link === selectedPage) {
					showPage(data, data.get(item.link));
				}
			});
		}
		if (item.hasOwnProperty('links')) {
			var listElement = document.createElement('ul');

			container.appendChild(listElement);
			item.links.forEach(sub=>{
				addMenuItem(data, url, listElement, sub, level + 1);
			});
		}
	}
	async function loadData() {
		var url = (location.origin + location.pathname).replace('index.html', '') + 'en/';
		try {
			const response = await fetch(url + "config.json");
			const result = await response.json();

			var pages = {
				data: {},
				add: function(link, body) {
					// var el = document.createElement(body);
					pages.data[link] = {
						text: 'TODO', // el.innerText,
						html: body
					};
				},
				get: function(link) {
					if (pages.data.hasOwnProperty(link)) {
						return pages.data[link];
					}
					return {};
				}
			};
			var menuElement = document.querySelector('ul.menu');
			result.forEach(item=>{
				addMenuItem(pages, url, menuElement, item, 0);
			});
		} catch (error) {
			console.error(error.message);
		}
	}
	loadData();
</script>

</body>
</html>
