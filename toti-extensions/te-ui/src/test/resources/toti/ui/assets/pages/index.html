	<div style="display: none;" id="control">

	<script type="text/javascript">

		function createPage(name) {
			var menu = document.querySelector('nav');
			var page = document.querySelector('section');

			var menuItem = document.createElement('div');
			menuItem.innerText = name
			menuItem.setAttribute('style', 'display: inline-block; margin: 5px; cursor: pointer');
			menu.appendChild(menuItem);

			var panel = document.createElement('div');
			panel.classList.add('panel');
			if (page.childElementCount > 0) {
				panel.style.display = 'none';
			}
			page.appendChild(panel);

			menuItem.onclick = ()=>{
				document.querySelectorAll('.panel').forEach((p)=>{
					p.style.display = 'none';
				});
				panel.style.display = 'inherit';
			};


			return panel;
		}

		getConf().forEach((conf)=>{
			var container = createPage(conf.name);
			var title = document.createElement('h3');
			title.innerText = conf.name;
			container.appendChild(title);

			conf.attributes.forEach((attributes, index)=>{
				attributes.name = conf.name + "_" + index;
				attributes.type = conf.type;

				var input = Toti.createInput(attributes);
				input.onChange((i)=>{
					console.log(i.getType(), i.getName(), i.getValue());
				});


				var control = document.createElement('div');
				control.innerHTML = document.getElementById('control').innerHTML;
				var btnSet = control.querySelector('#set');
				var txtSet = control.querySelector('#setValue');
				var btnClear = control.querySelector('#clear');
				var btnRead = control.querySelector('#read');
				var pnlRead = control.querySelector('#readPanel');
				btnClear.addEventListener('click', ()=>{
					input.clear();
					pnlRead.innerHTML = "";
				});
				btnSet.addEventListener('click', ()=>{
					input.setValue(txtSet.value);
					pnlRead.innerHTML = "";
				});
				btnRead.addEventListener('click', ()=>{
					pnlRead.innerHTML = pnlRead.innerHTML
					 + input.getName() + ":" + input.getValue()
					  + "<br>";
				});
				var configPanel = control.querySelector('#config');
				for (const[key, value] of Object.entries(attributes)) {
					configPanel.innerHTML = configPanel.innerHTML + key + ": " + JSON.stringify(value) + "<br>";
				}
				
				var inputCon = document.createElement('div');
				container.appendChild(inputCon);
				inputCon.style.display = 'inline-block';
				inputCon.style['margin-right'] = '1em';
				inputCon.appendChild(control);
				inputCon.appendChild(document.createElement('hr'));
				inputCon.appendChild(input.getContainer());
			});
		});
