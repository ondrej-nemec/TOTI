			{

			{

			},
			{
				type: 'image',
				name: 'Image',
				attributes: [
					{}
				]
			}
		].forEach((inputConf)=>{
			var container = document.createElement('div');
			document.body.appendChild(container);
			var title = document.createElement('h3');
			title.innerText = inputConf.name;
			container.appendChild(title);

			var control = document.createElement('div');
			control.innerHTML = document.getElementById('control').innerHTML;
			var btnSet = control.querySelector('#set');
			var txtSet = control.querySelector('#setValue');
			var btnClear = control.querySelector('#clear');
			var btnRead = control.querySelector('#read');
			var pnlRead = control.querySelector('#readPanel');

			container.appendChild(control);

			inputConf.attributes.forEach((attributes, index)=>{
				var inputCon = document.createElement('div');
				inputCon.style.display = 'inline-block';
				inputCon.style['margin-right'] = '1em';
				attributes.name = inputConf.name + "_" + index;
				attributes.type = inputConf.type;

				var input = Toti.createInput(attributes);
				input.onChange((i)=>{
					console.log(i.getType(), i.getName(), i.getValue());
				});
				inputCon.appendChild(input.getContainer());

				container.appendChild(inputCon);

				btnClear.addEventListener('click', ()=>{
					input.clear();
					pnlRead.innerHTML = "";
				});
				btnSet.addEventListener('click', ()=>{
					input.setValue(txtSet.value);
					pnlRead.innerHTML = "";
				});
				btnRead.addEventListener('click', ()=>{
					pnlRead.innerHTML = pnlRead.innerHTML
					 + input.getName() + ":" + input.getValue()
					  + "<br>";
				});
			});
		});
