<html>
<head>
	<title>TOTI samples</title>
	<style type="text/css">
		code {
			font-size: .875em;
		    color: #d63384;
		    word-wrap: break-word;
		}
		.tile {
			width: 200px;
			display: inline-block;
			background-color: #7FC6CC;
			color: #e3ffff;
			padding: 1em;
			margin: 0.5em;
		}
		
		.button {
			display: inline-block;
			cursor: pointer;
			margin: 10px;
			padding: 10px;
			border: solid 2px #e3ffff;
			border-radius:25%;
		}
	</style>
</head>
<body>
	<h1>TOTI samples disambiguation</h1>

	<div id="modules"></div>

	<script type="text/javascript">
		var modules = [
			{
				name: 'TOTI',
				description: 'Basic TOTI URLs and functions',
				links: [
					{
						name: 'Welcome page',
						description: 'TOTI Welcome page for verify system is running and responding.'
							+ ' Works only from develing IP addresses.',
						link: '/toti'
					},
					{
						name: 'Link to folder',
						description: 'Link points to folder inside www folder. TOTI prints filder content'
							+ ' Works only if dir response is allowed.',
						link: '/folder1'
					},
					{
						name: 'Link to folder',
						description: 'Link points to folder inside www folder, but folder contains index file.'
							+ ' TOTI open index file.'
							+ ' Works only if dir default file is set to index.html and dir response is forbidden.',
						link: '/folder2'
					},
					{
						name: 'Link to plain text file',
						description: 'Link points to file in www folder. TOTI opens file.',
						link: '/files/plainTextFile.txt'
					},
					{
						name: 'Link to binary file',
						description: 'Link points to file in www folder. Browser downloads file.',
						link: '/files/binaryFile.odt'
					}
				]
			},
			{
				name: 'Application: Exceptions',
				description: 'How TOTI reacts on different exceptions throwed in different sources.',
				links: [
					{
						name: 'Inside of method',
						description: 'Exception throwed directly in method.',
						link: '/application/exceptions/method'
					},
					{
						name: 'Secured',
						description: 'Exception throwed by TOTI because of missing logged user.',
						link: '/application/exceptions/secured'
					},
					{
						name: 'Request Interrupted',
						description: 'Request interrupted in createResponse step.',
						link: '/application/exceptions/interrupt'
					},
					{
						name: 'Wrong HTTP method',
						description: 'Exception throwed by TOTI because of wrong HTTP method.',
						link: '/application/exceptions/post'
					},
					{
						name: 'Catched',
						description: 'Exception catched by CustomExceptionExtension',
						link: '/application/exceptions/catched'
					}
				]
			},
			{
				name: 'Router',
				description: 'Static special routes mapped to existing URL.',
				links: [
					{
						name: 'TOTI',
						description: 'Route start with toti. Not working.',
						link: '/toti-test'
					},
					{
						name: 'Controller',
						description: 'Pointing to existing controller.',
						link: '/application-response.text'
					},
					{
						name: 'File',
						description: 'Pointing to file in resource directory. Not working.',
						link: '/ico'
					}
				]
			},
			{
				name: 'Application: Request',
				description: 'How TOTI handle different types of requests.',
				links: [
					{
						name: 'Basic',
						description: 'Simple request on controller method.',
						link: '/application/request/basic'
					},
					{
						name: 'URI parameter',
						description: 'Request on controller method with paramter (String).',
						link: '/application/request/basic/',
						options: [
							{
								name: 'Parameter: someRandomString',
								value: 'someRandomString'
							},
							{
								name: 'Parameter: 42 (number)',
								value: '42'
							}
						]
					},
					{
						name: 'HTTP POST',
						description: 'Request with POST method. Method GET cause Exception.',
						link: '/application/request/post',
						methods: [ 'POST' ]
					},
					{
						name: 'HTTP GET or POST',
						description: 'Controller method servers both GET and POST.',
						link: '/application/request/get-or-post',
						methods: [ 'GET', 'POST' ]
					},
					{
						name: 'URI query',
						description: 'Parsing query parameters',
						link: '/application/request/query?',
						options: [
							{
								name: 'Simple parameters',
								value: 'someText=aaaa&someNumber=12&anotherNumber=21&bool=true'
							},
							{
								name: 'Array',
								value: 'names[]=smith.john&names[]=doe.jane&names[]=my.name'
							},
							{
								name: 'Map',
								value: 'rate[0]=273.15&rate[26.85]=300&rate[100]=373.15'
							},
							{
								name: 'List in map',
								value: 'map[list][]=273.15&map[list][]=300&map[100]=373.15'
							},
							{
								name: 'Simple + list + map',
								value: 'age=42&name=my_name&list[]=a&list[]=b&map[a]=aa&map[b]=bb'
							},
							{
								name: 'Simple + list + map 2',
								value: 'age=42&list[]=a&list[]=b&map[a]=aa&map[b]=bb'
							}
						]
					},
					{
						name: 'Body type',
						description: 'Method accepted request body only in JSON.',
						link: '/application/request/body-type'
						// TODO body
					},
					{
						name: 'File',
						description: 'Serving request with file',
						link: '/application/request/file',
						// TODO file
					}
				]
			},
			{
				name: 'Application: Response',
				description: 'How can TOTI answer to request.',
				links: [
					{
						name: 'File from disk',
						description: 'Returns file from disk.',
						link: '/appication/response/file'
					},
					{
						name: 'Generate file',
						description: 'Returns runtime generated file.',
						link: '/appication/response/generate'
					},
					{
						name: 'JSON',
						description: 'Returns JSON response.',
						link: '/appication/response/json'
					},
					{
						name: 'Simple text',
						description: 'Returns simple text response.',
						link: '/appication/response/text'
					},
					{
						name: 'Template',
						description: 'Returns response created from tempkate. Requires registered TemplateExtension.',
						link: '/appication/response/template'
					},
					{
						name: 'Redirect inside application',
						description: 'Redirect to Simple text page.',
						link: '/appication/response/redirect'
					},
					{
						name: 'Redirect out of application',
						description: 'Redirect to Github.',
						link: '/appication/response/open-redirect'
					},
					{
						name: 'Websocket',
						description: 'Communication thru websocket.',
						link: '/appication/response/websocket'
					}
				]
			}
		];

		modules.forEach(function(module) {
			var headline = document.createElement("h3");
			headline.innerText = module.name;
			var desc = document.createElement('p');
			desc.innerText = module.description;
			var links = document.createElement("div");
			module.links.forEach(function(item) {
				var headline = document.createElement("h4");
				headline.innerText = item.name;

				var message = document.createElement('div');
				message.innerText = item.description;
				
				var dynamic = document.createElement('div');

				var container = document.createElement("div");
				container.classList.add('tile');

				container.appendChild(headline);
				container.appendChild(message);
				container.appendChild(dynamic);

				links.appendChild(container);

				if (item.hasOwnProperty('form')) {
					console.log(item.form);
				} else if (item.hasOwnProperty('options')) {
					var buttons = document.createElement('div');
					item.options.forEach((option)=>{
						var sync = document.createElement('div');
						sync.innerText =  option.name;
						sync.classList.add('button');
						sync.onclick = ()=>{
							window.open(item.link + option.value, '_blank').focus();
						};
						buttons.appendChild(sync);
					});
					container.appendChild(buttons);
				} else {
					var send = document.createElement('div');
					
					
					var sync = document.createElement('div');
					sync.innerText =  'Sync';
					sync.classList.add('button');
					sync.onclick = ()=>{
						window.open(item.link, '_blank').focus();
					};
/*
					var async = document.createElement('span');
					async.innerText =  'Async';
					async.classList.add('button');
*/
					var buttons = document.createElement('div');
					buttons.appendChild(sync);
//					buttons.appendChild(async);
					
					container.appendChild(send);
					container.appendChild(buttons);
				}
			});
			var container = document.createElement("div");
			container.appendChild(headline);
			container.appendChild(desc);
			container.appendChild(links);

			document.querySelector("#modules").appendChild(container);
		});
	</script>

</body>
</html>
